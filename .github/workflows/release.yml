name: Release

# Triggered by pushing a version tag: git tag v1.0.0 && git push origin v1.0.0
# Can also be triggered manually from the Actions tab (for testing)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

# The installers are uploaded under these fixed names, the same in every release, so README.md can
# link to releases/latest/download/<name> and always fetch the newest one. Renaming one here breaks
# the README's link to it. The in-app updater finds installers by extension, so it reads any name.
env:
  WINDOWS_INSTALLER: Shufflingway-Windows.msi
  MAC_INSTALLER: Shufflingway-macOS.pkg
  LINUX_INSTALLER: Shufflingway-Linux-amd64.deb

jobs:
  # ── Create the GitHub Release as a draft (the platform jobs upload into it) ──
  # A draft until publish-release runs, once every platform has uploaded: published any earlier,
  # the README's latest-release links and the in-app updater would find a release still missing
  # its installers while the platform jobs build them.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Extract version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          # Placed above the generated notes, so new users pick an installer, not the update jar.
          # The names in bold are the asset labels the platform jobs upload with.
          body: |
            ## Download

            | Platform | Download |
            | --- | --- |
            | Windows | **Windows Installer** |
            | macOS 13+ | **Mac Installer** |
            | Linux (Debian/Ubuntu) | **Linux Installer** |

            **In-app update** is the file **Help > Check for Updates** downloads to update an installed copy, on every platform. It is not an installer; new users should download the installer for their platform instead.

  # ── Windows installer (MSI) ────────────────────────────────────────────────
  release-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      # The Java the installers bundle (the macOS and Linux jobs set up the same version). The
      # updater's jar asset is named after it; an installed copy with an older runtime updates
      # through its installer instead.
      JAVA_FEATURE: '25'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./shufflingway

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_FEATURE }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        shell: bash
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      # jpackage includes every JAR in --input; keep only the fat JAR
      - name: Stage fat JAR for jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force jpackage-input | Out-Null
          Copy-Item target\shufflingway.jar jpackage-input\

      - name: Convert icon PNG to ICO
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png  = [System.Drawing.Image]::FromFile((Resolve-Path "src\main\resources\images\shufflingway.png"))
          $bmp  = New-Object System.Drawing.Bitmap(256, 256)
          $g    = [System.Drawing.Graphics]::FromImage($bmp)
          $g.DrawImage($png, 0, 0, 256, 256)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $icon  = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs    = [System.IO.FileStream]::new("Shufflingway.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose(); $bmp.Dispose(); $png.Dispose()

      - name: Run jpackage (MSI)
        shell: pwsh
        run: |
          jpackage `
            --input            jpackage-input `
            --name             Shufflingway `
            --app-version      ${{ needs.create-release.outputs.version }} `
            --vendor           "RockefellerA" `
            --main-jar         shufflingway.jar `
            --main-class       shufflingway.MainWindow `
            --java-options     "--enable-native-access=ALL-UNNAMED" `
            --icon             Shufflingway.ico `
            --win-dir-chooser `
            --win-per-user-install `
            --win-shortcut `
            --win-upgrade-uuid a3f8c4d2-7b9e-4f01-8c6a-2d5e9b03f7a1 `
            --type             msi `
            --dest             target/dist

      # What Help > Check for Updates downloads on every platform: the jar alone, which Windows swaps
      # into the user's install and macOS and Linux stage in the user's data folder. It carries the
      # natives for all three, so this job's copy serves them all. The name must match
      # UpdateChecker.JAR_ASSET.
      - name: Stage jar for the in-place updater
        shell: pwsh
        run: |
          Copy-Item target\shufflingway.jar "target\dist\shufflingway-${{ needs.create-release.outputs.version }}-java${{ env.JAVA_FEATURE }}.jar"

      # Uploaded with labels, which the release page shows in place of the file names. The updater
      # finds the installer by its extension and the jar by its name, and a label changes neither.
      # The MSI goes up under its fixed name (see env at the top); the jar keeps its versioned one.
      - name: Upload MSI and jar to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.create-release.outputs.version }}"
          mv "$(echo target/dist/*.msi)" "target/dist/$WINDOWS_INSTALLER"
          gh release upload "v$V" --repo "${{ github.repository }}" --clobber \
            "target/dist/$WINDOWS_INSTALLER#Windows Installer" \
            "target/dist/shufflingway-$V-java${{ env.JAVA_FEATURE }}.jar#In-app update (not an installer)"

  # ── macOS installer (PKG) ──────────────────────────────────────────────────
  release-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./shufflingway

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      # jpackage includes every JAR in --input; keep only the fat JAR
      - name: Stage fat JAR for jpackage
        run: |
          mkdir -p jpackage-input
          cp target/shufflingway.jar jpackage-input/

      - name: Compute macOS-compatible app-version
        id: macver
        run: |
          RAW="${{ needs.create-release.outputs.version }}"
          VER="$(echo "$RAW" | sed 's/^0\./1./')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Convert icon PNG to ICNS
        run: |
          mkdir -p Shufflingway.iconset
          sips -z 16   16   src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_16x16.png
          sips -z 32   32   src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_16x16@2x.png
          sips -z 32   32   src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_32x32.png
          sips -z 64   64   src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_32x32@2x.png
          sips -z 128  128  src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_128x128.png
          sips -z 256  256  src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_128x128@2x.png
          sips -z 256  256  src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_256x256.png
          sips -z 512  512  src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_256x256@2x.png
          sips -z 512  512  src/main/resources/images/shufflingway.png --out Shufflingway.iconset/icon_512x512.png
          iconutil -c icns Shufflingway.iconset

      - name: Run jpackage (PKG)
        run: |
          jpackage \
            --input            jpackage-input \
            --name             Shufflingway \
            --app-version      ${{ steps.macver.outputs.version }} \
            --vendor           "RockefellerA" \
            --main-jar         shufflingway.jar \
            --main-class       shufflingway.MainWindow \
            --java-options     "--enable-native-access=ALL-UNNAMED" \
            --icon             Shufflingway.icns \
            --type             pkg \
            --dest             target/dist

      # Under its fixed name (see env at the top), which also drops the 1.x version macOS needed.
      - name: Upload PKG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv "$(echo target/dist/*.pkg)" "target/dist/$MAC_INSTALLER"
          gh release upload "v${{ needs.create-release.outputs.version }}" --repo "${{ github.repository }}" --clobber \
            "target/dist/$MAC_INSTALLER#Mac Installer"

  # ── Linux DEB ─────────────────────────────────────────────────────────────
  release-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./shufflingway

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set pom version
        run: mvn versions:set -DnewVersion=${{ needs.create-release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build fat JAR
        run: mvn package -DskipTests

      - name: Stage fat JAR for jpackage
        run: |
          mkdir -p jpackage-input
          cp target/shufflingway.jar jpackage-input/

      - name: Run jpackage (DEB)
        run: |
          jpackage \
            --input            jpackage-input \
            --name             shufflingway \
            --app-version      ${{ needs.create-release.outputs.version }} \
            --vendor           "RockefellerA" \
            --main-jar         shufflingway.jar \
            --main-class       shufflingway.MainWindow \
            --java-options     "--enable-native-access=ALL-UNNAMED" \
            --icon             src/main/resources/images/shufflingway.png \
            --linux-shortcut \
            --type             deb \
            --dest             target/dist

      # Under its fixed name (see env at the top). apt reads the package's name and version from
      # inside the .deb, so the file name is free to change.
      - name: Upload DEB to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv "$(echo target/dist/*.deb)" "target/dist/$LINUX_INSTALLER"
          gh release upload "v${{ needs.create-release.outputs.version }}" --repo "${{ github.repository }}" --clobber \
            "target/dist/$LINUX_INSTALLER#Linux Installer"

  # ── Publish the release once every platform has uploaded ──────────────────
  # Only now does it become the latest release, which the README's links and the in-app updater
  # read. If any platform job fails, the release stays a draft and the previous one stays latest.
  publish-release:
    needs: [create-release, release-windows, release-macos, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" --repo "${{ github.repository }}" \
            --draft=false
